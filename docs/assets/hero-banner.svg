<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Azure SRE Agent Deployment Automation — Checkout Reliability Lab</title>
  <desc id="hero-desc">Keyless GitOps deployment architecture for Azure SRE Agent using Terraform, PowerShell, Microsoft Entra ID, and GitHub Actions OIDC in West US 3.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B19"/>
      <stop offset="45%" stop-color="#0B1933"/>
      <stop offset="100%" stop-color="#0D2847"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132647" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A162B" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="80%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="20%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow-blue)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow-emerald)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="16.5" fill="none" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Top accent bar -->
  <rect x="52" y="34" width="110" height="5" rx="2.5" fill="url(#accent-grad)"/>

  <!-- Eyebrow tag -->
  <g transform="translate(52, 54)">
    <rect x="0" y="0" width="338" height="28" rx="14" fill="#0F294A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="16" cy="14" r="5" fill="#10B981"/>
    <text x="30" y="18.5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7DD3FC" letter-spacing="1.1">KEYLESS GITOPS • CHECKOUT RELIABILITY LAB</text>
  </g>

  <!-- Main Title -->
  <text x="52" y="132" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Azure SRE Agent Deployment Automation
  </text>

  <!-- Subtitle -->
  <text x="52" y="168" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94A3B8">
    End-to-end infrastructure &amp; data-plane GitOps with Terraform, PowerShell, Entra ID &amp; GitHub OIDC
  </text>
  <text x="52" y="193" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B">
    Zero API keys • Zero storage account keys • Single owner per object • Reproducible fault &amp; AI investigation lab
  </text>

  <!-- Feature Pills -->
  <g transform="translate(52, 232)" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="176" height="40" rx="10" fill="url(#card-grad)" stroke="#0078D4" stroke-width="1.2"/>
      <circle cx="22" cy="20" r="8" fill="#0078D4" fill-opacity="0.25"/>
      <path d="M19 20 l2 2 l5 -5" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="24.5" fill="#E2E8F0">100% Keyless Entra</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(190, 0)">
      <rect width="198" height="40" rx="10" fill="url(#card-grad)" stroke="#8B5CF6" stroke-width="1.2"/>
      <circle cx="22" cy="20" r="8" fill="#8B5CF6" fill-opacity="0.25"/>
      <path d="M18 16 h8 v8 h-8 z" stroke="#C4B5FD" stroke-width="1.6" fill="none"/>
      <text x="38" y="24.5" fill="#E2E8F0">Terraform 1.15.2 ARM</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(402, 0)">
      <rect width="206" height="40" rx="10" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="22" cy="20" r="8" fill="#38BDF8" fill-opacity="0.25"/>
      <path d="M18 17 l4 3 l-4 3 M23 23 h4" stroke="#7DD3FC" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="24.5" fill="#E2E8F0">7 SRE Data-Plane Kinds</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(622, 0)">
      <rect width="174" height="40" rx="10" fill="url(#card-grad)" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="22" cy="20" r="8" fill="#10B981" fill-opacity="0.25"/>
      <circle cx="22" cy="20" r="3.5" fill="#34D399"/>
      <text x="38" y="24.5" fill="#E2E8F0">West US 3 Verified</text>
    </g>
  </g>

  <!-- Right-side Telemetry & Agent Radar Graphic -->
  <g transform="translate(880, 32)">
    <!-- Outer radar card -->
    <rect x="0" y="0" width="272" height="256" rx="16" fill="#091528" fill-opacity="0.85" stroke="#1E3A5F" stroke-width="1.5"/>
    <!-- Header bar -->
    <rect x="0" y="0" width="272" height="36" rx="16" fill="#0F2442"/>
    <circle cx="18" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="32" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="46" cy="18" r="4.5" fill="#10B981"/>
    <text x="64" y="22" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#93C5FD">sre-checkout-westus3</text>

    <!-- Pulse wave / Telemetry graph -->
    <g transform="translate(20, 54)">
      <text x="0" y="12" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#64748B">TELEMETRY • ContainerAppConsoleLogs</text>
      <rect x="0" y="20" width="232" height="62" rx="8" fill="#060E1C" stroke="#1E293B" stroke-width="1"/>
      <polyline points="10,64 38,64 52,64 64,34 74,72 86,42 98,64 128,64 142,32 152,70 164,64 196,64 222,64" fill="none" stroke="url(#accent-grad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="34" r="3.5" fill="#F59E0B"/>
      <circle cx="142" cy="32" r="3.5" fill="#EF4444"/>
      <circle cx="222" cy="64" r="3.5" fill="#10B981"/>
      <text x="10" y="34" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#F87171">PAYMENT_PROVIDER_TIMEOUT (3000ms)</text>
      <text x="155" y="76" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#34D399">42ms OK</text>
    </g>

    <!-- Agent convergence status list -->
    <g transform="translate(20, 148)" font-family="Consolas, 'Courier New', monospace" font-size="10.5">
      <text x="0" y="10" fill="#64748B">GITOPS CONVERGENCE • 8 ASSETS</text>
      <g transform="translate(0, 20)">
        <rect width="110" height="22" rx="5" fill="#0D2847" stroke="#0284C7" stroke-width="0.8"/>
        <text x="8" y="14.5" fill="#7DD3FC">✓ connectors (2)</text>
      </g>
      <g transform="translate(120, 20)">
        <rect width="112" height="22" rx="5" fill="#0D2847" stroke="#0284C7" stroke-width="0.8"/>
        <text x="8" y="14.5" fill="#7DD3FC">✓ prompts &amp; tools</text>
      </g>
      <g transform="translate(0, 48)">
        <rect width="110" height="22" rx="5" fill="#0D2847" stroke="#10B981" stroke-width="0.8"/>
        <text x="8" y="14.5" fill="#6EE7B7">✓ skills &amp; hooks</text>
      </g>
      <g transform="translate(120, 48)">
        <rect width="112" height="22" rx="5" fill="#0D2847" stroke="#10B981" stroke-width="0.8"/>
        <text x="8" y="14.5" fill="#6EE7B7">✓ agent &amp; tasks</text>
      </g>
      <text x="0" y="88" font-size="10" fill="#94A3B8">Mode: <tspan fill="#34D399" font-weight="700">Review</tspan> • Auth: <tspan fill="#38BDF8" font-weight="700">OIDC + UAMI</tspan></text>
    </g>
  </g>
</svg>
